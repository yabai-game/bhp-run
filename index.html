<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1530">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="author" content="YABAI">
  <meta name="description" content="BHP Run — game chạy vô tận trên điện thoại. Một game của YABAI.">
  <title>BHP Run</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="mute" aria-label="Bật/Tắt âm thanh">
    <svg class="icon-sound" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
    <svg class="icon-mute" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>
  <canvas id="game"></canvas>
  <div id="disclaimer" role="dialog" aria-modal="true" aria-labelledby="disclaimer-title">
    <div class="disclaimer-card">
      <h2 id="disclaimer-title">Tuyên bố</h2>
      <p>Game không dùng cho mục đích thương mại. Chỉ mang tính giáo dục với phương châm:</p>
      <p class="disclaimer-motto">“Không nên suy nghĩ trở thành lao động BHP”</p>
      <button id="disclaimer-ok" type="button">Tôi đã hiểu</button>
    </div>
  </div>
  <div id="rotate">Xoay dọc điện thoại để chơi</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
